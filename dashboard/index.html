<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenUtility Bot — Dashboard</title>
<style>
html,body{margin:0;background:#060910;color:#fff;font-family:system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center}.loader{text-align:center;color:#9aa8bb}.spin{width:30px;height:30px;border:3px solid #ffffff18;border-top-color:#58a6ff;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}.err{max-width:440px;padding:24px;text-align:center}.err button{background:#58a6ff;color:#fff;border:0;border-radius:10px;padding:10px 15px}
</style>
</head>
<body>
<div class="loader"><div class="spin"></div>Loading OpenUtility Dashboard…</div>
<script>
(async()=>{
  try{
    const r=await fetch('../dashboard-core.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Dashboard could not be loaded.');
    const html=await r.text();
    const polished=html.replace('</body>','<script src="../dashboard-polish.js"><\\/script><script src="../dashboard-v4.js"><\\/script></body>');
    document.open(); document.write(polished); document.close();
  }catch(e){document.body.innerHTML='<div class="err"><h2>Dashboard unavailable</h2><p>'+String(e.message).replace(/[<>]/g,'')+'</p><button onclick="location.reload()">Try again</button></div>';}
})();
</script>
</body>
</html>
