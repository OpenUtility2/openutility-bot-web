<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenUtility Bot — Dashboard</title><link rel="icon" href="./assets/openutility-logo.svg" type="image/svg+xml"><style>:root{--bg:#070a10;--panel:#0d121b;--line:#202a39;--text:#f4f7fb;--muted:#8d9aae;--blue:#58a6ff;--purple:#8b7cff;--good:#55e6a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 80% 0,#174a7033,transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.nav{height:72px;border-bottom:1px solid #ffffff0b;display:flex;align-items:center;background:#070a10dd;backdrop-filter:blur(16px)}.nav .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:10px}.btn{border:1px solid var(--line);background:#ffffff07;color:var(--text);border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--purple))}main{padding:48px 0 90px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.head h1{margin:0;font-size:42px;letter-spacing:-2px}.muted{color:var(--muted);line-height:1.6}.user{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.server{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#101721,#0b1018);padding:19px;cursor:pointer;transition:.2s}.server:hover,.server.selected{border-color:#58a6ff70;transform:translateY(-2px)}.top{display:flex;align-items:center;gap:12px}.icon,.fallback{width:50px;height:50px;border-radius:14px;object-fit:cover}.fallback{display:grid;place-items:center;background:linear-gradient(135deg,#58a6ff,#786cff);font-weight:900}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.status{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;color:var(--muted)}.ok{color:var(--good)}.panel{display:none;margin-top:18px;padding:23px;border:1px solid #58a6ff35;border-radius:20px;background:#0c121b}.panel.show{display:block}.panelhead{display:flex;justify-content:space-between;gap:20px;align-items:center}.title{display:flex;align-items:center;gap:13px}.title h2{margin:0 0 3px}.title p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.stat{padding:15px;border:1px solid #ffffff0d;border-radius:13px;background:#ffffff04}.stat b{font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.action{text-align:left;padding:15px;border:1px solid #ffffff0d;border-radius:13px;background:#ffffff05;color:var(--text);cursor:pointer}.action:hover{border-color:#58a6ff40;background:#58a6ff0b}.action strong{display:block}.action small{color:var(--muted)}.box{padding:25px;border:1px dashed #ffffff18;border-radius:15px;color:var(--muted)}.loader{display:inline-block;width:14px;height:14px;border:2px solid #ffffff30;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats,.actions{grid-template-columns:repeat(2,1fr)}.head{display:block}.head .user{margin-top:15px}.panelhead{align-items:start;flex-direction:column}}</style></head><body><header class="nav"><div class="wrap"><a class="brand" href="./"><img class="logo" src="./assets/openutility-logo.svg" alt="OpenUtility logo"><span>OpenUtility Bot</span></a><a class="btn" href="./">Main site</a></div></header><main class="wrap"><div class="head"><div><h1>Your servers</h1><p class="muted">Choose a Discord server you have permission to manage.</p></div><div class="user" id="user"></div></div><div id="grid" class="grid"><div class="box"><span class="loader"></span> Loading Discord servers…</div></div><div id="panel" class="panel"><div class="panelhead"><div id="title" class="title"></div><button class="btn" onclick="closePanel()">Change server</button></div><div id="stats" class="stats"></div><div class="actions"><button class="action" onclick="notice('Overview')"><strong>Overview</strong><small>Server health and stats</small></button><button class="action" onclick="notice('Configuration')"><strong>Configuration</strong><small>Server settings</small></button><button class="action" onclick="notice('Moderation')"><strong>Moderation</strong><small>Manage protection</small></button><button class="action" onclick="notice('Logging')"><strong>Logging</strong><small>Configure audit logs</small></button></div></div></main><script>const API='https://openutility-bot-backend.vercel.app/api';let guilds=[];const $=id=>document.getElementById(id);function icon(g){return g.icon?`https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=128`:''}function avatar(id,h){return h?`https://cdn.discordapp.com/avatars/${id}/${h}.png?size=128`:''}function fallback(n,c='fallback'){return `<div class="${c}">${String(n||'S').slice(0,2).toUpperCase()}</div>`}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(path,opts={}){const r=await fetch(API+path,{credentials:'include',...opts});if(!r.ok){let e='Request failed';try{e=(await r.json()).error||e}catch{}throw new Error(e)}return r.json()}async function init(){try{const me=await api('/me');const av=avatar(me.user.id,me.user.avatar);$('user').innerHTML=`${av?`<img class="avatar" src="${av}">`:''}<span>${esc(me.user.global_name||me.user.username)}</span>`;const data=await api('/guilds');guilds=data.guilds||[];render()}catch(e){$('grid').innerHTML=`<div class="box">${esc(e.message)}<br><br><a class="btn primary" href="${API}/auth/discord">Login with Discord</a></div>`}}function render(){$('grid').innerHTML=guilds.length?guilds.map((g,i)=>{const im=icon(g);return `<article class="server" onclick="select(${i})"><div class="top">${im?`<img class="icon" src="${im}">`:fallback(g.name)}<div><div class="name">${esc(g.name)}</div><div class="meta">${g.owner?'Owner':'Manageable server'}</div></div></div><div class="status"><span>${g.memberCount!=null?g.memberCount.toLocaleString()+' members':'Discord server'}</span><span class="${g.botInstalled?'ok':''}">${g.botInstalled?'● Bot installed':'○ Bot not detected'}</span></div></article>`}).join(''):'<div class="box">No manageable servers were returned by Discord.</div>'}function select(i){const g=guilds[i];document.querySelectorAll('.server').forEach((x,n)=>x.classList.toggle('selected',n===i));const im=icon(g);$('title').innerHTML=`${im?`<img class="icon" src="${im}">`:fallback(g.name)}<div><h2>${esc(g.name)}</h2><p>${g.botInstalled?'OpenUtility Bot is installed and ready.':'OpenUtility Bot is not detected in this server.'}</p></div>`;$('stats').innerHTML=`<div class="stat"><b>${g.memberCount!=null?g.memberCount.toLocaleString():'—'}</b><span>Members</span></div><div class="stat"><b>${g.onlineCount!=null?g.onlineCount.toLocaleString():'—'}</b><span>Online</span></div><div class="stat"><b>${g.botInstalled?'Ready':'—'}</b><span>Bot status</span></div><div class="stat"><b>${g.owner?'Owner':'Manager'}</b><span>Your access</span></div>`;$('panel').classList.add('show');$('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}function closePanel(){$('panel').classList.remove('show')}function notice(x){alert(x+' controls are connected to the selected server.')}async function logout(){await fetch(API+'/auth/logout',{method:'POST',credentials:'include'}).catch(()=>{});location.href='./'}init();</script></body></html>
